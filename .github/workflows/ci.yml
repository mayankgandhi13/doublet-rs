name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo fmt --check
        working-directory: bindings/r/src/rust
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo test --features hnsw

  # Builds the self-contained CRAN tarball (core crate bundled, crates
  # vendored) that the jobs below check.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: bindings/r
      - run: scripts/build-r-package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: r-package
          path: dist/doubletrs_*.tar.gz

  # R CMD check --as-cran on the tarball, as CRAN runs it (NOT_CRAN unset,
  # so the build is offline from the vendored crates).
  check:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: bindings/r
          extra-packages: any::rcmdcheck
      - uses: actions/download-artifact@v4
        with:
          name: r-package
          path: dist
      - name: R CMD check --as-cran
        shell: Rscript {0}
        run: |
          tarball <- list.files("dist", "^doubletrs_.*[.]tar[.]gz$", full.names = TRUE)
          rcmdcheck::rcmdcheck(tarball, args = c("--as-cran", "--no-manual"),
                               error_on = "warning", check_dir = "check")
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-${{ matrix.os }}
          path: check

  # Installs the tarball with the oldest Rust we claim to support.
  msrv:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.71.0
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: bindings/r
      - uses: actions/download-artifact@v4
        with:
          name: r-package
          path: dist
      - run: rustc --version && R CMD INSTALL dist/doubletrs_*.tar.gz
      - run: Rscript testthat.R
        working-directory: bindings/r/tests
